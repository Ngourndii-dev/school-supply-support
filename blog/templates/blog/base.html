{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Supply Support</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/blog.css' %}">
</head>
<body class="light-mode">
    <header>
        <div class="container d-flex justify-content-between align-items-center">
            <h1 class="mb-0">
                <a href="/" class="text-decoration-none">
                    <i class="fas fa-school icon-wrapper"></i> School Supply Support
                </a>
            </h1>
            <button id="theme-toggle" class="btn btn-theme">
                <i class="fas fa-moon"></i> Dark Mode
            </button>
        </div>
    </header>

    <main class="container my-5">
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <div class="container">
            <p>© 2025 School Supply Support. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({
            once: true,
            offset: 100
        });

        $(document).ready(function() {
            const themeToggle = $('#theme-toggle');
            const body = $('body');

            themeToggle.click(function() {
                body.toggleClass('light-mode dark-mode');
                const isDark = body.hasClass('dark-mode');
                themeToggle.html(isDark 
                    ? '<i class="fas fa-sun"></i> Light Mode' 
                    : '<i class="fas fa-moon"></i> Dark Mode');
            });
        });
    </script>
</body>
</html>
